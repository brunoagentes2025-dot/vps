<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lunar Lander</title>
<style>
:root{--bg:#f4f4f2;--fg:#1a1a1a;--card:#fff;--line:#d6d6d2;--acc:#2a6df4;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121316;--fg:#ececec;--card:#1c1e22;--line:#34373d;--acc:#6b9bff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121316;--fg:#ececec;--card:#1c1e22;--line:#34373d;--acc:#6b9bff;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;padding:12px;gap:10px}
h1{font-size:18px;margin:0}
#wrap{width:100%;max-width:900px}
canvas{width:100%;height:auto;display:block;background:#05060c;border-radius:10px;border:1px solid var(--line);touch-action:none}
	canvas{aspect-ratio:var(--ar,1.8);display:block}
.panel{width:100%;max-width:900px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
label{display:flex;flex-direction:column;gap:4px;font-size:14px}
label span b{float:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--acc)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:10px 16px;font-size:15px;cursor:pointer}
.touch{display:none;gap:8px;width:100%;max-width:900px;flex-wrap:wrap}
.touch button{flex:1;padding:18px 0;font-size:20px;user-select:none;-webkit-user-select:none;touch-action:none}
@media (pointer:coarse){.touch{display:flex}}
small{opacity:.7}
#wrap,.stage{position:relative}
.fsb{position:absolute;right:8px;bottom:8px;padding:4px 9px;font-size:16px;background:rgba(0,0,0,.55)}
#wrap.fs{position:fixed;inset:0;z-index:99;max-width:none;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center}
#wrap.fs .stage{width:min(100vw,calc(100vh*var(--ar,1.8)))}
#wrap.fs canvas{border:0;border-radius:0}
#wrap.fs .touch{position:absolute;left:0;right:0;bottom:10px;padding:0 10px;opacity:.55;max-width:none;width:auto}
label.chk{flex-direction:row;align-items:center;gap:8px}
details.parBox{grid-column:1/-1}details.parBox summary{cursor:pointer;font-size:14px;font-weight:600}
.parGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:10px}
.parG{border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:8px;margin:0;min-width:0}
.parG legend{font-size:13px;opacity:.8;padding:0 4px}
	.row input[type=text],.row select{padding:9px 10px;font-size:14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);min-width:160px}
	
/* CONTORLES CELULAR BOTOES */	
#ctl{display:none;position:absolute;inset:0;pointer-events:none;z-index:5;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#ctl svg{width:100%;height:100%;display:block}
@media (pointer:coarse){#ctl{display:block}}
#ctl.on{display:block}
.svgctl .touch{display:none!important}
#fsb{z-index:9}	

#menu{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(6px,2vh,16px);background:rgba(5,6,12,.88);color:#fff;text-align:center}
#menu h2{margin:0;font-size:clamp(22px,6vh,44px)}
#menu p{margin:0;opacity:.85}
#menuBtns{display:grid;grid-template-columns:repeat(2,minmax(120px,1fr));gap:clamp(8px,2vh,16px);width:min(80%,520px)}
#menuBtns button{padding:clamp(10px,3vh,22px) 10px;font-size:clamp(16px,3.4vh,26px);font-weight:bold}
#endBtns{display:none;position:absolute;left:50%;top:64%;transform:translateX(-50%);z-index:7;gap:10px;flex-wrap:wrap;justify-content:center;width:90%}
#endBtns button{padding:12px 22px;font-size:clamp(15px,2.6vh,24px);font-weight:bold}
</style>
</head>

(function(){

/* ---------- camadas de parallax (parallax4 = mais distante ... parallax1 = mais próxima) ----------

   com o cenário, >100% mais rápido que o chão) · Influência do zoom (0% = não muda de tamanho com o zoom, 100% = igual ao cenário) · Tamanho da imagem (100% = altura do retângulo) · Posição X/Y inicial (deslocamento em px a partir do retângulo). */
var parImg=[null,null,null,null,null],parFoc0={x:0,y:0};
function carregarParallax(n){

function drawParallax(vw,vh,shX,shY){

  for(var k=4;k>=1;k--){

    var b=(k-1)*6,vx=+PAR_SL[b].value/100,vy=+PAR_SL[b+1].value/100,zi=+PAR_SL[b+2].value/100,tam=+PAR_SL[b+3].value/100,rx=R.x+(+PAR_SL[b+4].value),ry=R.y+(+PAR_SL[b+5].value);   // rx, ry: posição da camada no início da fase (retângulo + deslocamento dos sliders)
    var s=Math.pow(zm,zi);                                    // escala da camada: 0% = ignora o zoom, 100% = igual ao cenário
    var ex=parFoc0.x+(fx-parFoc0.x)*vx,ey=parFoc0.y+(fy-parFoc0.y)*vy;   // foco no "espaço" da camada
    var ih=R.h*tam,iw=img.naturalWidth*ih/img.naturalHeight,top=   /* tamanho: 100% = altura do retângulo; o topo e o x do retângulo ficam fixos */ cy+(ry-ey)*s;
    if(top>H||top+ih*s<0)continue;                            // fora da tela na vertical
    if(PAR_CK[k-1].checked){

function ctlBind(b,box){
  var el=null,tc=null;
  b[1].forEach(function(n){if(!el){el=svgPick(box,n);tc=svgPick(box,n+'_touch')}});
  if(!el)return;
  el.style.pointerEvents='all';el.style.touchAction='none';
  if(tc){tc.style.display='none';tc.style.pointerEvents='none'}
  var act={};
  function show(on){
    keys[b[0]]=on;
    if(tc)tc.style.display=on?'inline':'none';
    if(BTN_TROCA)el.style.opacity=on?'0':'';       // opacity 0 (e não display:none) para continuar recebendo o toque
  }
  function release(e){if(act[e.pointerId]){delete act[e.pointerId];if(!Object.keys(act).length)show(false)}}
  el.addEventListener('pointerdown',function(e){
    e.preventDefault();
    if(false){startGame();return}
    try{el.setPointerCapture(e.pointerId)}catch(_){}
    act[e.pointerId]=1;show(true);
    if(state!=='play')newLevel();
  });
  ['pointerup','pointercancel','lostpointercapture'].forEach(function(ev){el.addEventListener(ev,release)});
  el.addEventListener('contextmenu',function(e){e.preventDefault()});
}
function ctlInit(){
  var box=$('ctl');
  if(/[?&]touch=1/.test(location.search))box.classList.add('on');   // teste no PC: abrir com ?touch=1
  fetch(CTL_SVG).then(function(r){if(!r.ok)throw new Error(r.status);return r.text()}).then(function(txt){
    box.innerHTML=txt;
    var svg=box.querySelector('svg');if(!svg)return;
    svg.removeAttribute('width');svg.removeAttribute('height');
    CTL_BTNS.forEach(function(b){ctlBind(b,box)});
    document.body.classList.add('svgctl');          // esconde os botões antigos
  }).catch(function(){});
}
	
	
	var CTL_ANCHOR=true;   // true: botões da esquerda grudam na borda esquerda e os da direita na borda direita
function ctlAnchor(){
  var box=$('ctl'),svg=box.querySelector('svg');
  if(!svg||!CTL_ANCHOR)return;
  var vb=svg.viewBox&&svg.viewBox.baseVal;if(!vb||!vb.width)return;
  var r=box.getBoundingClientRect();if(!r.width)return;
  var s=Math.min(r.width/vb.width,r.height/vb.height),extra=Math.max(0,(r.width/s-vb.width)/2);
  CTL_BTNS.forEach(function(b){
    var el=null;b[1].forEach(function(n){if(!el)el=svgPick(box,n)});
    if(!el)return;
    if(b.side===undefined){var q=el.getBoundingClientRect();if(!q.width)return;b.side=(q.left+q.width/2-r.left)<r.width/2?-1:1}
    b[1].forEach(function(n){[n,n+'_touch'].forEach(function(id){
      var e=svgPick(box,id);if(!e)return;
      if(e._tr===undefined)e._tr=e.getAttribute('transform')||'';
      if(extra>0)e.setAttribute('transform','translate('+(b.side*extra)+',0) '+e._tr);
      else if(e._tr)e.setAttribute('transform',e._tr);else e.removeAttribute('transform');
    })});
  });
}
window.addEventListener('resize',ctlAnchor);
	
	
ctlInit();	
	
var toastMsg='',toastUntil=0;
function toast(m){toastMsg=m;toastUntil=performance.now()+3500}
function achaPreset(n){                                   // aceita "fase1", "Fase 1", "FASE_1", "fase-1"...
  var alvo='fase'+n,norm=function(s){return String(s).toLowerCase().replace(/[\s_\-]+/g,'')};
  if(PRE[alvo])return alvo;
  var ks=Object.keys(PRE);
  for(var i=0;i<ks.length;i++)if(norm(ks[i])===alvo)return ks[i];
  return null;
}	
/* ---------- tela inicial: escolha da fase ---------- */
var FASES=[                       // para criar outra fase: copie uma linha
  {n:1,nome:'Fase 1'},
  {n:2,nome:'Fase 2'},
  {n:3,nome:'Fase 3'},
  {n:4,nome:'Fase 4'}
];
var SVG_FASE=['fases/fase{n}/fase.svg','fases/fase{n}/fase{n}.svg','fase{n}.svg'];   // tenta nesta ordem
function carregarSvg(n){
  var i=0,tentados=[];
  function tenta(){
    var url=SVG_FASE[i].replace(/\{n\}/g,n);tentados.push(url);
    return Fase.load(url).catch(function(e){
      if(++i<SVG_FASE.length)return tenta();
      throw new Error('não achei a fase '+n+'. Tentei: '+tentados.join(' | '));
    });
  }
  return tenta();
}
var FASE_N=0,loopOn=false,iniciando=false;
function menuMostrar(on){$('menu').style.display=on?'flex':'none'}
function proximaFase(){
  for(var i=0;i<FASES.length;i++)if(FASES[i].n===FASE_N)return FASES[i+1]||null;
  return null;
}
function iniciarFase(n){
  started=false;musReset();
  Object.keys(keys).forEach(function(k){keys[k]=false});
  if(!AC)initAudio();if(AC&&AC.state==='suspended')AC.resume();     // precisa acontecer dentro do clique
  $('menuMsg').textContent='Carregando...';
  pList().then(function(){return carregarSvg(n)}).then(function(L){
    WW=L.WW;WH=L.WH;FASE_N=n;FASE_DIR=L.dir||'';var imgsOk=imagensFase();carregarParallax(n);impAud();
  return Promise.race([imgsOk,new Promise(function(r){setTimeout(r,5000)})]).then(function(){   // espera as imagens da fase (máx. 5 s)
 var nome=achaPreset(n),base=Object.assign({},DEF,window.LUNAR_CONFIG||{});
if(nome){
  pApply(Object.assign({},base,PRE[nome]));$('pSel').value=nome;     // config base + preset da fase
  $('pfLbl').textContent='Fase '+n+' · preset "'+nome+'"';toast('Preset "'+nome+'" aplicado');
}else{
  pApply(base);                                                      // sem preset: volta à config base
  $('pfLbl').textContent='Fase '+n+' · sem preset (use "Salvar na fase atual")';
  toast(Object.keys(PRE).length?'Sem preset para a fase '+n:'Não consegui ler '+API_PRESETS+' (abra pelo servidor PHP)');
  console.warn('[fase '+n+'] preset não encontrado. Existem: '+Object.keys(PRE).join(', '));
}       // aplica o preset "fase1", "fase2"...
    newLevel();
    iniciando=true;startGame();iniciando=false;
    menuMostrar(false);$('menuMsg').textContent='';
    if(!loopOn){loopOn=true;requestAnimationFrame(loop)}
  });}).catch(function(e){
    menuMostrar(true);$('menuMsg').textContent='Erro ao carregar a fase '+n+': '+(e.message||e);
  });
}
$('pFase').addEventListener('click',function(){
  $('pFase').blur();
  if(!FASE_N){pMsg('entre em uma fase primeiro');return}
  var nome=achaPreset(FASE_N)||('fase'+FASE_N);
  pApi({acao:'salvar',nome:nome,config:current()}).then(function(d){
    PRE=d;pRender(nome);$('pfLbl').textContent='Fase '+FASE_N+' · preset "'+nome+'"';
    toast('Configuração salva na fase '+FASE_N+' ✓');pMsg('salvo ✓');
  }).catch(function(){toast('Erro ao salvar (servidor)');pMsg('erro ao salvar')});
});	
	$('pfLbl').textContent='';
function voltarMenu(){
  started=false;musReset();
  Object.keys(keys).forEach(function(k){keys[k]=false});
  menuMostrar(true);
}
FASES.forEach(function(f){
  var b=document.createElement('button');b.textContent=f.nome;
  b.addEventListener('click',function(){iniciarFase(f.n)});
  $('menuBtns').appendChild(b);
});
$('again').addEventListener('click',function(){$('again').blur();newLevel()});
$('next').addEventListener('click',function(){var p=proximaFase();if(p)iniciarFase(p.n)});
$('toMenu').addEventListener('click',voltarMenu);
$('mnu').addEventListener('click',function(){$('mnu').blur();voltarMenu()});
})();
	

</script>
