<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
:root{--bg:#f4f4f2;--fg:#1a1a1a;--card:#fff;--line:#d6d6d2;--acc:#2a6df4;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121316;--fg:#ececec;--card:#1c1e22;--line:#34373d;--acc:#6b9bff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121316;--fg:#ececec;--card:#1c1e22;--line:#34373d;--acc:#6b9bff;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;padding:12px;gap:10px}
h1{font-size:18px;margin:0}
#wrap{width:100%;max-width:900px}
canvas{width:100%;height:auto;display:block;background:#05060c;border-radius:10px;border:1px solid var(--line);touch-action:none}
	canvas{aspect-ratio:var(--ar,1.8);display:block}
.panel{width:100%;max-width:900px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
label{display:flex;flex-direction:column;gap:4px;font-size:14px}
label span b{float:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--acc)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:10px 16px;font-size:15px;cursor:pointer}
.touch{display:none;gap:8px;width:100%;max-width:900px;flex-wrap:wrap}
.touch button{flex:1;padding:18px 0;font-size:20px;user-select:none;-webkit-user-select:none;touch-action:none}
@media (pointer:coarse){.touch{display:flex}}
small{opacity:.7}
#wrap,.stage{position:relative}
.fsb{position:absolute;right:8px;bottom:8px;padding:4px 9px;font-size:16px;background:rgba(0,0,0,.55)}
#wrap.fs{position:fixed;inset:0;z-index:99;max-width:none;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center}
#wrap.fs .stage{width:min(100vw,calc(100vh*var(--ar,1.8)))}
#wrap.fs canvas{border:0;border-radius:0}
#wrap.fs .touch{position:absolute;left:0;right:0;bottom:10px;padding:0 10px;opacity:.55;max-width:none;width:auto}
label.chk{flex-direction:row;align-items:center;gap:8px}
	.row input[type=text],.row select{padding:9px 10px;font-size:14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);min-width:160px}
	
/* CONTORLES CELULAR BOTOES */	
#ctl{display:none;position:absolute;inset:0;pointer-events:none;z-index:5;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#ctl svg{width:100%;height:100%;display:block}
@media (pointer:coarse){#ctl{display:block}}
#ctl.on{display:block}
.svgctl .touch{display:none!important}
#fsb{z-index:6}	
</style>
</head>
<body>
<h1>🚀 Lunar Lander</h1>
<div id="wrap"><div class="stage"><canvas id="c" width="900" height="500"></canvas><button id="fsb" class="fsb" title="Tela cheia (F)">⛶</button><div id="ctl"></div></div>
<div class="touch">
  <button id="bL">◀</button><button id="bU">▲</button><button id="bR">▶</button>
  <button id="bA">A</button><button id="bD">D</button>
</div></div>

<div class="panel">
  <label><span>Controle do jato (inclinação máx.) <b id="vG"></b></span><input id="sG" type="range" min="5" max="90" step="1" value="20"></label>
  <label><span>Força do jato <b id="vT"></b></span><input id="sT" type="range" min="0" max="12" step="0.1" value="4.5"></label>
  <label><span>Jatos laterais (← →) <b id="vS"></b></span><input id="sS" type="range" min="0.5" max="8" step="0.1" value="2.5"></label>
  <label><span>Gravidade da fase <b id="vH"></b></span><input id="sH" type="range" min="0.5" max="6" step="0.1" value="1.6"></label>
  <label><span>Estabilizador (0 = física pura) <b id="vB"></b></span><input id="sB" type="range" min="0" max="100" step="5" value="60"></label>
  <label><span>Consumo de combustível <b id="vC"></b></span><input id="sC" type="range" min="0" max="10" step="0.1" value="1"></label>
  <label><span>Zoom máximo (chão / parado) <b id="vZP"></b></span><input id="sZP" type="range" min="1" max="30" step="0.05" value="1.8"></label>
  <label><span>Zoom mínimo (alto / rápido) <b id="vZL"></b></span><input id="sZL" type="range" min="0.0" max="10" step="0.05" value="0.55"></label>
  <label><span>Sensibilidade à altura <b id="vHA"></b></span><input id="sHA" type="range" min="0" max="300" step="1" value="40"></label>
  <label><span>Sensibilidade à velocidade horizontal (x) <b id="vVX"></b></span><input id="sVX" type="range" min="0" max="100" step="1" value="30"></label>
  <label><span>Sensibilidade à velocidade vertical (y) <b id="vVY"></b></span><input id="sVY" type="range" min="0" max="100" step="1" value="30"></label>
  <label><span>Rapidez do zoom <b id="vRZ"></b></span><input id="sRZ" type="range" min="1" max="30" step="1" value="6"></label>
	<label><span>Raio das trilhas das bases <b id="vMR"></b></span><input id="sMR" type="range" min="5" max="1000" step="5" value="80"></label>
<label><span>Volume das trilhas <b id="vMV"></b></span><input id="sMV" type="range" min="0" max="100" step="1" value="70"></label>
	<label><span>Tremida de tela no impacto <b id="vSK"></b></span><input id="sSK" type="range" min="0" max="1000" step="5" value="100"></label>
<label><span>Volume do impacto (sample) <b id="vIV"></b></span><input id="sIV" type="range" min="0" max="300" step="1" value="80"></label>
  <label class="chk"><input id="inv" type="checkbox"> Inverter lados dos jatos laterais</label>
  <label class="chk"><input id="snd" type="checkbox" checked> Som</label>
  <div class="row"><button id="rs">Nova fase (R)</button><button id="fs">⛶ Tela cheia (F)</button><button id="cp">Copiar configuração</button><button id="rst">Restaurar do config.js</button>
	  
	  <div class="row" style="grid-column:1/-1">
  <input id="pn" type="text" placeholder="Nome da configuração">
  <button id="pSave">💾 Salvar</button>
  <select id="pSel"></select>
  <button id="pLoad">Carregar</button>
  <button id="pDel">Apagar</button>
  <small id="pst"></small>
</div>
	  
	  
	  <small id="cst"></small><small>▲ jato · ◀ ▶ jatos laterais · A / D inclinam o bico</small></div>
</div>
<script src="config.js"></script>
	<script src="fase.js"></script>
<script>
(function(){
var cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=900,H=500,PX=30,ST=30,N=184,WW=N*ST,WH=H;
var $=function(i){return document.getElementById(i)};
var sG=$('sG'),sT=$('sT'),sH=$('sH'),sS=$('sS'),sB=$('sB'),sC=$('sC'),sZP=$('sZP'),sZL=$('sZL'),sHA=$('sHA'),sVX=$('sVX'),sVY=$('sVY'),sRZ=$('sRZ'),sMR=$('sMR'),sMV=$('sMV'),sSK=$('sSK'),sIV=$('sIV'),inv=$('inv'),snd=$('snd');
function labels(){$('vG').textContent=sG.value+'°';$('vT').textContent=(+sT.value).toFixed(1)+' m/s²';$('vS').textContent=(+sS.value).toFixed(1)+' m/s²';$('vH').textContent=(+sH.value).toFixed(1)+' m/s²';$('vB').textContent=sB.value+'%';$('vC').textContent='×'+(+sC.value).toFixed(1);$('vZP').textContent='×'+(+sZP.value).toFixed(2);$('vZL').textContent='×'+(+sZL.value).toFixed(2);$('vHA').textContent=sHA.value+'%';$('vVX').textContent=sVX.value+'%';$('vVY').textContent=sVY.value+'%';$('vRZ').textContent=sRZ.value+'%';$('vMR').textContent=sMR.value+' m';$('vMV').textContent=sMV.value+'%';$('vSK').textContent=sSK.value+'%';$('vIV').textContent=sIV.value+'%'}
[sG,sT,sH,sS,sB,sC,sZP,sZL,sHA,sVX,sVY,sRZ,sMR,sMV,sSK,sIV].forEach(function(s){s.addEventListener('input',labels);s.addEventListener('change',function(){s.blur()})});
inv.addEventListener('change',function(){inv.blur()});
var DEF={gimbal:20,forca:4.5,lateral:2.5,gravidade:1.6,estabilizador:60,consumo:1,inverterLaterais:false,som:true,
  zoomPerto:1.8,zoomLonge:.55,sensAltura:40,sensVelX:30,sensVelY:30,rapidezZoom:6,raioMusica:80,volMusica:70,tremida:100,volImpacto:80,
  tanque:100,reabastecimento:30,gastoJato:3,gastoLateral:1,pousoVertMax:3.2,pousoHorizMax:2.2,pousoAnguloMax:20};
var saved=null;try{saved=JSON.parse(localStorage.getItem('lunarCfg')||'null')}catch(e){}
var hasFile=!!window.LUNAR_CONFIG;
var CFG=Object.assign({},DEF,window.LUNAR_CONFIG||{},saved||{});
var CTRL=[['gimbal',sG],['forca',sT],['lateral',sS],['gravidade',sH],['estabilizador',sB],['consumo',sC],['zoomPerto',sZP],['zoomLonge',sZL],['sensAltura',sHA],['sensVelX',sVX],['sensVelY',sVY],['rapidezZoom',sRZ],['raioMusica',sMR],['volMusica',sMV],['tremida',sSK],['volImpacto',sIV]];
CTRL.forEach(function(c){c[1].value=CFG[c[0]]});
inv.checked=!!CFG.inverterLaterais;snd.checked=!!CFG.som;
function current(){var o={};Object.keys(DEF).forEach(function(k){o[k]=CFG[k]});CTRL.forEach(function(c){o[c[0]]=+c[1].value});o.inverterLaterais=inv.checked;o.som=snd.checked;return o}
function save(){try{localStorage.setItem('lunarCfg',JSON.stringify(current()))}catch(e){}}
CTRL.forEach(function(c){c[1].addEventListener('input',save)});inv.addEventListener('change',save);snd.addEventListener('change',save);
$('cst').textContent=(hasFile?'config.js carregado ✓':'config.js não encontrado ✗')+(saved?' · usando valores salvos neste navegador':'');
$('rst').addEventListener('click',function(){try{localStorage.removeItem('lunarCfg')}catch(e){}location.reload()});
$('cp').addEventListener('click',function(){
  var b=$('cp'),o=current();
  var t='window.LUNAR_CONFIG = {\n'+Object.keys(o).map(function(k){return '  '+k+': '+o[k]}).join(',\n')+'\n};\n';
  function ok(){b.textContent='Copiado!';setTimeout(function(){b.textContent='Copiar configuração'},1500)}
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok,function(){window.prompt('Copie e cole no config.js:',t)});
  else window.prompt('Copie e cole no config.js:',t);
  b.blur();
});
labels();
	
	
	
	var PRE={};
function pApi(b){return fetch('presets.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(function(r){return r.json()})}
function pMsg(m){$('pst').textContent=m;setTimeout(function(){$('pst').textContent=''},2500)}
function pRender(sel){var s=$('pSel');s.innerHTML='';
  Object.keys(PRE).sort().forEach(function(n){var o=document.createElement('option');o.value=o.textContent=n;s.appendChild(o)});
  if(sel&&PRE[sel])s.value=sel}
function pList(){pApi({acao:'listar'}).then(function(d){PRE=d;pRender()}).catch(function(){pMsg('servidor indisponível')})}
function pApply(o){
  Object.keys(o).forEach(function(k){CFG[k]=o[k]});
  CTRL.forEach(function(c){if(o[c[0]]!==undefined)c[1].value=o[c[0]]});
  if(o.inverterLaterais!==undefined)inv.checked=!!o.inverterLaterais;
  if(o.som!==undefined){snd.checked=!!o.som;snd.dispatchEvent(new Event('change'))}
  labels();save();
}
$('pSave').addEventListener('click',function(){
  var n=$('pn').value.trim()||$('pSel').value;
  if(!n){pMsg('digite um nome');return}
  if(PRE[n]&&!confirm('Já existe "'+n+'". Sobrescrever?'))return;
  pApi({acao:'salvar',nome:n,config:current()}).then(function(d){PRE=d;pRender(n);$('pn').value='';pMsg('salvo ✓')}).catch(function(){pMsg('erro ao salvar')});
  $('pSave').blur();
});
$('pLoad').addEventListener('click',function(){
  var n=$('pSel').value;if(n&&PRE[n]){pApply(PRE[n]);pMsg('carregado ✓')}
  $('pLoad').blur();
});
$('pDel').addEventListener('click',function(){
  var n=$('pSel').value;if(!n||!confirm('Apagar "'+n+'"?'))return;
  pApi({acao:'apagar',nome:n}).then(function(d){PRE=d;pRender();pMsg('apagado')}).catch(function(){pMsg('erro')});
  $('pDel').blur();
});
$('pSel').addEventListener('dblclick',function(){$('pLoad').click()});
pList();
	
	
	
var AC=null,mst,jetG,sideG,refO,refG,nbuf,started=false,lastState='play';
function loopNoise(f,type){var s=AC.createBufferSource();s.buffer=nbuf;s.loop=true;var fl=AC.createBiquadFilter();fl.type=type;fl.frequency.value=f;var g=AC.createGain();g.gain.value=0;s.connect(fl);fl.connect(g);g.connect(mst);s.start();return g}
function initAudio(){try{
  AC=new (window.AudioContext||window.webkitAudioContext)();
  mst=AC.createGain();mst.gain.value=snd.checked?.5:0;mst.connect(AC.destination);
  nbuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);var d=nbuf.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  jetG=loopNoise(450,'lowpass');sideG=loopNoise(2200,'bandpass');
	refO=AC.createOscillator();refO.type='triangle';refO.frequency.value=300;
refG=AC.createGain();refG.gain.value=0;
refO.connect(refG);refG.connect(mst);refO.start();
}catch(e){AC=null}}
snd.addEventListener('change',function(){if(AC)mst.gain.setTargetAtTime(snd.checked?.5:0,AC.currentTime,.02);snd.blur()});
document.addEventListener('visibilitychange',function(){if(!AC)return;if(document.hidden)AC.suspend();else AC.resume()});
function tone(f,d,type,v,delay,f2){if(!AC)return;var t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.3,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(mst);o.start(t);o.stop(t+d+.05)}
function burst(d,f0,f1,v,delay){if(!AC)return;var t=AC.currentTime+(delay||0),s=AC.createBufferSource();s.buffer=nbuf;
  var fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.setValueAtTime(f0,t);fl.frequency.exponentialRampToValueAtTime(f1,t+d);
  var g=AC.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  s.connect(fl);fl.connect(g);g.connect(mst);s.start(t);s.stop(t+d+.05)}
	function playSample(file,vol){
  if(!snd.checked)return;
  var a=new Audio(file);
  a.volume=vol||1;
  a.play().catch(function(){});
}
function sndStart(){[262,330,392,523].forEach(function(f,i){tone(f,.18,'square',.12,i*.09)});tone(784,.4,'triangle',.18,.4)}
//function sndTouch(){tone(140,.18,'sine',.5,0,45);burst(.12,900,120,.35)}
	function sndTouch(){playSample('toque.mp3',0.05)}
function sndGood(){tone(660,.12,'triangle',.25,0);tone(880,.12,'triangle',.25,.1);tone(1175,.22,'triangle',.25,.2)}

function sndCrash(){burst(1.1,3000,60,.9);tone(110,.7,'sawtooth',.35,0,30)}
function sndWin(){[523,659,784,1047,784,1047,1319].forEach(function(f,i){tone(f,.22,'square',.12,i*.14)});tone(1568,.7,'triangle',.2,1)}
function sndLost(){[392,330,262,196].forEach(function(f,i){tone(f,.3,'triangle',.25,i*.22)});tone(98,.9,'sine',.35,.9)}
	
	
	/* trilhas das bases: quanto mais perto, mais alto */
var MUSICA_EXT='mp3';   // extensão dos arquivos
var MUSICA_CURVA=2;     // 1 = linear, 2 = mais suave perto e mais rápido longe
var MUS=null;
function musNome(p,k){return p.kind==='saida'?'musica_saida':(p.kind==='chegada'?'musica_chegada':'musica_base'+(k+1))}
function musBuild(){
  MUS=[];
  pads.forEach(function(p,k){
    var a=new Audio(musNome(p,k)+'.'+MUSICA_EXT);
    a.loop=true;a.preload='auto';a.volume=0;
    var m={a:a,p:p,v:0,bad:false,tryAt:0};
    a.addEventListener('error',function(){m.bad=true});
    MUS.push(m);
  });
}
function musPlay(){if(!MUS)return;MUS.forEach(function(m){if(!m.bad&&m.a.paused){var r=m.a.play();if(r&&r.catch)r.catch(function(){})}})}
function musUpdate(){
  if(!started||!pads||!ship)return;
  if(!MUS){musBuild();musPlay()}
  var R=Math.max(1,(+sMR.value)*PX),vol=(+sMV.value)/100,on=snd.checked&&!document.hidden,now=performance.now();
  MUS.forEach(function(m){
    if(m.bad)return;
    var d=Math.hypot(ship.x-(m.p.x1+m.p.x2)/2,ship.y-m.p.y);
    var g=on?Math.pow(Math.max(0,1-d/R),MUSICA_CURVA)*vol:0;
    m.v+=(g-m.v)*.15;
    m.a.volume=Math.max(0,Math.min(1,m.v));
    if(on&&m.a.paused&&now-m.tryAt>1000){m.tryAt=now;var r=m.a.play();if(r&&r.catch)r.catch(function(){})}
  });
}
document.addEventListener('visibilitychange',function(){
  if(!MUS)return;
  MUS.forEach(function(m){if(document.hidden)m.a.pause()});
  if(!document.hidden)musPlay();
});
	
function startGame(){if(started)return;initAudio();if(AC&&AC.state==='suspended')AC.resume();started=true;sndStart();musUpdate()}
function setFS(on){var w=$('wrap');w.classList.toggle('fs',on);
  var cur=document.fullscreenElement||document.webkitFullscreenElement;
  if(on){var rq=w.requestFullscreen||w.webkitRequestFullscreen;
    if(rq){try{var p=rq.call(w);if(p&&p.catch)p.catch(function(){})}catch(e){}}}
  else if(cur){(document.exitFullscreen||document.webkitExitFullscreen).call(document)}}
function toggleFS(){setFS(!$('wrap').classList.contains('fs'))}
['fullscreenchange','webkitfullscreenchange'].forEach(function(ev){document.addEventListener(ev,function(){
  if(!(document.fullscreenElement||document.webkitFullscreenElement))$('wrap').classList.remove('fs')})});
$('fs').addEventListener('click',function(){toggleFS();$('fs').blur()});
$('fsb').addEventListener('click',function(){toggleFS();$('fsb').blur()});
var keys={up:false,l:false,r:false,a:false,d:false},terrain,pads,ship,state,msg='',cam=0,camY=0,zm=1;
var touched=false,airT=0,restT=0;
var PTS=[[-16,17],[16,17],[-10,8],[10,8],[-9,-8],[9,-8],[0,-14]];
var K=4000,C=70,KF=60,MU=0.8,I=250;
	
var PAD_ALT=[100,220,440,260,00]; // altura de cada base (MENOR = MAIS ALTO)
var RUGOSO=1535;                      // intensidade das lombadinhas (0 = terreno liso)
	
function newLevel(){
  var L=Fase.level;if(!L)return;
  pads=L.pads;
  ship={x:L.start.x,y:L.start.y,vx:0,vy:0,th:0,w:0,g:0,sf:0,fuel:CFG.tanque,thr:false,refuel:false};
  state='play';msg='';touched=true;airT=0;restT=0;zm=1;
  cam=Math.max(0,Math.min(WW-W,ship.x-W/2));camY=Math.min(WH+20-H,ship.y-H*.4);
  if(started)sndStart();
}
function groundY(x){return Fase.below(Math.max(1,Math.min(WW-1,x)),ship.y+17,true)}
var cFx,cFy,cTw,cN,cFeet,cBody,cImp=0;
function contacts(c,s){
  cFx=0;cFy=0;cTw=0;cN=0;cFeet=0;cBody=false;cImp=0;
  for(var i=0;i<PTS.length;i++){
    var lx=PTS[i][0],ly=PTS[i][1],rx=lx*c-ly*s,ry=lx*s+ly*c;
    var q=Fase.hit(ship.x+rx,ship.y+ry);
    if(!q)continue;
    var d=q.d,nx=q.nx,ny=q.ny;
    var vx=ship.vx-ship.w*ry,vy=ship.vy+ship.w*rx;
    var vn=vx*nx+vy*ny,vt=vx*(-ny)+vy*nx;
	  if(-vn>cImp)cImp=-vn;
    var fn=Math.max(0,K*d-C*vn);
    var lim=MU*fn,ft=-Math.max(-lim,Math.min(lim,KF*vt));
    var Fx=fn*nx+ft*(-ny),Fy=fn*ny+ft*nx;
    cFx+=Fx;cFy+=Fy;cTw+=(rx*Fy-ry*Fx)/I;cN++;
    if(i<2)cFeet++;else if(d>2)cBody=true;
	  
  }
}
	
/* ---------- impacto: tremida de tela + sample ---------- */
var IMP_MIN=0.8;      // abaixo dessa velocidade de batida (m/s) não treme nem toca
var IMP_MAX=12;       // velocidade de batida (m/s) que dá o efeito máximo
var SHAKE_PX=22;      // tremida máxima em pixels (com sensibilidade 100%)
var shake=0,impCd=0;
var IMP_AUD=new Audio('impacto.mp3');IMP_AUD.preload='auto';
function impacto(v){                       // v = velocidade da batida em m/s
  var f=Math.min(1,v/IMP_MAX);             // 0 a 1
  shake=Math.max(shake,f*(+sSK.value)/100*SHAKE_PX);
  if(!snd.checked)return;

function step(dt){

    }

	//TIRE O LIMITE CÉU 
//  if(ship.y<10){ship.y=10;if(ship.vy<0)ship.vy=0}
  var sp=Math.hypot(ship.vx,ship.vy);

  var up=Math.abs(ship.th)<.3,pi=-1;

  }
}

function svgPick(root,name){                       // acha pelo id; se não achar, pelo nome da camada do Inkscape
  var e=root.querySelector('[id="'+name+'"]');

function ctlBind(b,box){
  var el=null,tc=null;
  b[1].forEach(function(n){if(!el){el=svgPick(box,n);tc=svgPick(box,n+'_touch')}});
  if(!el)return;
  el.style.pointerEvents='all';el.style.touchAction='none';
  if(tc){tc.style.display='none';tc.style.pointerEvents='none'}
  var act={};
  function show(on){
    keys[b[0]]=on;

    if(BTN_TROCA)el.style.opacity=on?'0':'';       // opacity 0 (e não display:none) para continuar recebendo o toque
  }
  function release(e){if(act[e.pointerId]){delete act[e.pointerId];if(!Object.keys(act).length)show(false)}}
  el.addEventListener('pointerdown',function(e){
    e.preventDefault();
    if(!started){startGame();return}
    try{el.setPointerCapture(e.pointerId)}catch(_){}
    act[e.pointerId]=1;show(true);

  document.body.insertAdjacentHTML('afterbegin','<p style="color:#f87171;font:15px system-ui;margin:0 0 8px">Erro ao carregar a fase: '+e.message+'</p>');
});
})();
	

</script>
