<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel do Evento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0E0F13;
    --card: #FFFFFF;
    --card-text: #1B1B1F;
    --card-text-soft: #6B6B72;
    --accent: #FF4D67;
    --accent-soft: rgba(255,77,103,0.14);
    --ring: #FFC24B;
    --hashtag-color: #4D7CFF;
    font-family: 'Inter', sans-serif;
  }
  :root:not([data-theme="light"]) { color-scheme: dark; }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: var(--bg);
    overflow: hidden;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ---------- HEADER FIXO (marca do evento) ---------- */
  .top-bar {
    position: fixed;
    top: env(safe-area-inset-top, 0px);
    left: 0; right: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 28px 48px;
    z-index: 10;
    color: #fff;
    pointer-events: none;
  }
  .event-hashtag {
    font-family: 'Manrope', sans-serif;
    font-weight: 800;
    font-size: clamp(20px, 2.4vw, 34px);
    letter-spacing: -0.01em;
  }
  .event-hashtag span { color: var(--hashtag-color); }
  .live-badge {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.14);
    padding: 8px 18px 8px 14px;
    border-radius: 999px;
    font-size: clamp(12px, 1vw, 15px);
    font-weight: 600;
  }
  .live-dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--accent);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,77,103,0.55); }
    50% { box-shadow: 0 0 0 8px rgba(255,77,103,0); }
  }

  /* ---------- STAGE ---------- */
  .stage {
    width: 100%; height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* ---------- CARD (replica do post) ---------- */
  .post-card {
    background: var(--card);
    color: var(--card-text);
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 40px 90px rgba(0,0,0,0.5);
    opacity: 0;
    transform: scale(0.97);
    transition: opacity 0.6s ease, transform 0.6s ease;
    display: flex;
    flex-direction: column;
  }
  .post-card.visible { opacity: 1; transform: scale(1); }

  .post-header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 18px 22px;
  }
  .avatar {
    width: 46px; height: 46px;
    border-radius: 50%;
    object-fit: cover;
    background: #ddd;
    border: 2px solid var(--ring);
    padding: 2px;
    background-clip: content-box;
  }
  .who { display: flex; flex-direction: column; line-height: 1.25; }
  .who .name { font-weight: 700; font-size: 16px; }
  .who .loc { font-size: 13px; color: var(--card-text-soft); }

  .post-media {
    width: 100%;
    flex: 1;
    min-height: 0;
    object-fit: cover;
    background: #eee;
    display: block;
  }

  .post-actions {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 16px 22px 4px;
  }
  .post-actions svg { width: 26px; height: 26px; }

  .post-stats {
    padding: 10px 22px 0;
    font-weight: 700;
    font-size: 15px;
  }

  .post-caption {
    padding: 8px 22px 22px;
    font-size: 15px;
    line-height: 1.45;
  }
  .post-caption .name { font-weight: 700; margin-right: 6px; }
  .post-caption .tags { color: var(--hashtag-color); font-weight: 500; }

  /* ---------- LAYOUT: HORIZONTAL (TV widescreen) ---------- */
  body.is-landscape .post-card {
    flex-direction: row;
    width: min(88vw, 1400px);
    height: min(78vh, 780px);
  }
  body.is-landscape .post-media { width: 60%; height: 100%; }
  body.is-landscape .post-body {
    width: 40%;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  body.is-landscape .post-caption { flex: 1; overflow: hidden; }
  body.is-landscape .post-header .name { font-size: 19px; }
  body.is-landscape .post-caption { font-size: 17px; }
  body.is-landscape .post-stats { font-size: 17px; }

  /* ---------- LAYOUT: VERTICAL (painel retrato) ---------- */
  body.is-portrait .post-card {
    flex-direction: column;
    width: min(86vw, 640px);
    height: min(84vh, 1100px);
  }
  body.is-portrait .post-media { height: 66%; }
  body.is-portrait .post-body { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  body.is-portrait .post-caption { flex: 1; overflow: hidden; }

  /* ---------- Contador / próximo ---------- */
  .progress {
    position: absolute;
    bottom: max(28px, env(safe-area-inset-bottom, 0px));
    left: 50%;
    transform: translateX(-50%);
    width: 220px;
    height: 4px;
    background: rgba(255,255,255,0.15);
    border-radius: 4px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: var(--accent);
    border-radius: 4px;
  }
  .progress-fill.animating { transition: width 10s linear; width: 100%; }
</style>
</head>
<body>

  <div class="top-bar">
    <div class="event-hashtag"><span>#</span><span id="hashtagLabel">carregando…</span></div>
    <div class="live-badge"><span class="live-dot"></span> AO VIVO</div>
  </div>

  <div class="stage">
    <div class="post-card" id="card">
      <img class="post-media" id="media" alt="">
      <div class="post-body">
        <div class="post-header">
          <img class="avatar" id="avatar" alt="">
          <div class="who">
            <span class="name" id="username"></span>
            <span class="loc" id="location"></span>
          </div>
        </div>
        <div class="post-actions">
          <svg viewBox="0 0 24 24" fill="none" stroke="#1B1B1F" stroke-width="1.8"><path d="M12 21s-7.5-4.6-10-9.3C.4 8.1 2 4.5 5.6 4c2-.3 3.9.7 4.9 2.3.5-1.6 2.9-2.6 4.9-2.3 3.6.5 5.2 4.1 3.6 7.7C19.5 16.4 12 21 12 21z"/></svg>
          <svg viewBox="0 0 24 24" fill="none" stroke="#1B1B1F" stroke-width="1.8"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5 8.3 8.3 0 0 1-4-1L3 20l1-4.4A8.3 8.3 0 0 1 3 11.5 8.5 8.5 0 0 1 11.5 3 8.5 8.5 0 0 1 21 11.5z"/></svg>
        </div>
        <div class="post-stats" id="likes"></div>
        <div class="post-caption" id="caption"></div>
      </div>
    </div>
    <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // ---------- CONFIGURAÇÃO DO SUPABASE ----------
  const SUPABASE_URL = 'https://bblvcitsuvfodbkugejl.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJibHZjaXRzdXZmb2Ria3VnZWpsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxMzE0MDUsImV4cCI6MjEwNTcwNzQwNX0.qeiJI0EssNYlhnmZZwLR0IUYTQWnb3mm4fD-poGuruY';

  // ID do evento vem pela URL: painel-eventos.html?evento=UUID-DO-EVENTO
  const EVENTO_ID = new URLSearchParams(location.search).get('evento');

  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const card = document.getElementById('card');
  const fill = document.getElementById('progressFill');
  let ciclo = null;
  let temPostNovo = false; // sinalizado pelo Realtime, força busca antes do tempo normal

  function render(post) {
    document.getElementById('avatar').src = post.owner_profile_pic_url || '';
    document.getElementById('media').src = post.display_url || post.post_url || '';
    document.getElementById('username').textContent = post.owner_username || '';
    document.getElementById('location').textContent = post.location_name || '';
    document.getElementById('likes').textContent =
      (post.likes_count || 0).toLocaleString('pt-BR') + ' curtidas';
    const tags = Array.isArray(post.hashtags)
      ? post.hashtags.map(h => '#' + h).join(' ')
      : '';
    document.getElementById('caption').innerHTML =
      '<span class="name">' + (post.owner_username || '') + '</span>' +
      (post.caption || '') + ' <span class="tags">' + tags + '</span>';
  }

  async function buscarProximoPost() {
    const { data, error } = await supabaseClient
      .from('posts')
      .select('*')
      .eq('evento_id', EVENTO_ID)
      .order('exibido_em', { ascending: true, nullsFirst: true })
      .limit(1);

    if (error) {
      console.error('Erro ao buscar post:', error);
      return null;
    }
    return data?.[0] || null;
  }

  async function marcarComoExibido(postId) {
    const { error } = await supabaseClient.rpc('marcar_exibido', { post_id_input: postId });
    if (error) console.error('Erro ao marcar como exibido:', error);
  }

  async function showNext() {
    const post = await buscarProximoPost();
    if (!post) return; // nenhum post ainda pra esse evento

    card.classList.remove('visible');
    fill.classList.remove('animating');
    fill.style.width = '0%';

    setTimeout(() => {
      render(post);
      card.classList.add('visible');
      requestAnimationFrame(() => fill.classList.add('animating'));
      marcarComoExibido(post.id);
    }, 350);
  }

  function iniciarCiclo() {
    if (ciclo) clearInterval(ciclo);
    ciclo = setInterval(showNext, 10000);
  }

  function applyOrientation() {
    const landscape = window.innerWidth >= window.innerHeight;
    document.body.classList.toggle('is-landscape', landscape);
    document.body.classList.toggle('is-portrait', !landscape);
  }
  window.addEventListener('resize', applyOrientation);
  applyOrientation();

  // ---------- REALTIME: reage a posts novos sem esperar o ciclo normal ----------
  if (EVENTO_ID) {
    supabaseClient
      .channel('posts-evento-' + EVENTO_ID)
      .on('postgres_changes',
        { event: 'INSERT', schema: 'public', table: 'posts', filter: 'evento_id=eq.' + EVENTO_ID },
        () => { showNext(); iniciarCiclo(); } // post novo chegou: mostra e reseta o cronômetro
      )
      .subscribe();
  }

  async function carregarHashtagEvento() {
    if (!EVENTO_ID) {
      document.getElementById('hashtagLabel').textContent = 'defina ?evento=ID-DO-EVENTO na URL';
      return;
    }
    const { data } = await supabaseClient
      .from('eventos')
      .select('hashtag')
      .eq('id', EVENTO_ID)
      .single();
    document.getElementById('hashtagLabel').textContent = data?.hashtag || '';
  }

  carregarHashtagEvento();
  showNext();
  iniciarCiclo();
</script>
</body>
</html>
