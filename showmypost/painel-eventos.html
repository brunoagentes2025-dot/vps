<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel do Evento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0E0F13;
    --card: #FFFFFF;
    --card-text: #1B1B1F;
    --card-text-soft: #6B6B72;
    --accent: #FF4D67;
    --accent-soft: rgba(255,77,103,0.14);
    --ring: #FFC24B;
    --hashtag-color: #4D7CFF;
    font-family: 'Inter', sans-serif;
  }
  :root:not([data-theme="light"]) { color-scheme: dark; }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: var(--bg);
    overflow: hidden;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ---------- HEADER FIXO (marca do evento) ---------- */
  .top-bar {
    position: fixed;
    top: env(safe-area-inset-top, 0px);
    left: 0; right: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 28px 48px;
    z-index: 10;
    color: #fff;
    pointer-events: none;
  }
  .event-hashtag {
    font-family: 'Manrope', sans-serif;
    font-weight: 800;
    font-size: clamp(20px, 2.4vw, 34px);
    letter-spacing: -0.01em;
  }
  .event-hashtag span { color: var(--hashtag-color); }
  .live-badge {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.14);
    padding: 8px 18px 8px 14px;
    border-radius: 999px;
    font-size: clamp(12px, 1vw, 15px);
    font-weight: 600;
  }
  .live-dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--accent);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,77,103,0.55); }
    50% { box-shadow: 0 0 0 8px rgba(255,77,103,0); }
  }

  /* ---------- STAGE ---------- */
  .stage {
    width: 100%; height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* ---------- CARD (replica do post) ---------- */
  .post-card {
    background: var(--card);
    color: var(--card-text);
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 40px 90px rgba(0,0,0,0.5);
    opacity: 0;
    transform: scale(0.97);
    transition: opacity 0.6s ease, transform 0.6s ease;
    display: flex;
    flex-direction: column;
  }
  .post-card.visible { opacity: 1; transform: scale(1); }

  .post-header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 18px 22px;
  }
  .avatar {
    width: 46px; height: 46px;
    border-radius: 50%;
    object-fit: cover;
    background: #ddd;
    border: 2px solid var(--ring);
    padding: 2px;
    background-clip: content-box;
  }
  .who { display: flex; flex-direction: column; line-height: 1.25; }
  .who .name { font-weight: 700; font-size: 16px; }
  .who .loc { font-size: 13px; color: var(--card-text-soft); }

  .post-media {
    width: 100%;
    flex: 1;
    min-height: 0;
    object-fit: cover;
    background: #eee;
    display: block;
  }

  .post-actions {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 16px 22px 4px;
  }
  .post-actions svg { width: 26px; height: 26px; }

  .post-stats {
    padding: 10px 22px 0;
    font-weight: 700;
    font-size: 15px;
  }

  .post-caption {
    padding: 8px 22px 22px;
    font-size: 15px;
    line-height: 1.45;
  }
  .post-caption .name { font-weight: 700; margin-right: 6px; }
  .post-caption .tags { color: var(--hashtag-color); font-weight: 500; }

  /* ---------- LAYOUT: HORIZONTAL (TV widescreen) ---------- */
  body.is-landscape .post-card {
    flex-direction: row;
    width: min(88vw, 1400px);
    height: min(78vh, 780px);
  }
  body.is-landscape .post-media { width: 60%; height: 100%; }
  body.is-landscape .post-body {
    width: 40%;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  body.is-landscape .post-caption { flex: 1; overflow: hidden; }
  body.is-landscape .post-header .name { font-size: 19px; }
  body.is-landscape .post-caption { font-size: 17px; }
  body.is-landscape .post-stats { font-size: 17px; }

  /* ---------- LAYOUT: VERTICAL (painel retrato) ---------- */
  body.is-portrait .post-card {
    flex-direction: column;
    width: min(86vw, 640px);
    height: min(84vh, 1100px);
  }
  body.is-portrait .post-media { height: 66%; }
  body.is-portrait .post-body { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  body.is-portrait .post-caption { flex: 1; overflow: hidden; }

  /* ---------- Contador / próximo ---------- */
  .progress {
    position: absolute;
    bottom: max(28px, env(safe-area-inset-bottom, 0px));
    left: 50%;
    transform: translateX(-50%);
    width: 220px;
    height: 4px;
    background: rgba(255,255,255,0.15);
    border-radius: 4px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: var(--accent);
    border-radius: 4px;
  }
  .progress-fill.animating { transition: width 10s linear; width: 100%; }
</style>
</head>
<body>

  <div class="top-bar">
    <div class="event-hashtag"><span>#</span><span id="hashtagLabel">bigvoxbr</span></div>
    <div class="live-badge"><span class="live-dot"></span> AO VIVO</div>
  </div>

  <div class="stage">
    <div class="post-card" id="card">
      <img class="post-media" id="media" alt="">
      <div class="post-body">
        <div class="post-header">
          <img class="avatar" id="avatar" alt="">
          <div class="who">
            <span class="name" id="username"></span>
            <span class="loc" id="location"></span>
          </div>
        </div>
        <div class="post-actions">
          <svg viewBox="0 0 24 24" fill="none" stroke="#1B1B1F" stroke-width="1.8"><path d="M12 21s-7.5-4.6-10-9.3C.4 8.1 2 4.5 5.6 4c2-.3 3.9.7 4.9 2.3.5-1.6 2.9-2.6 4.9-2.3 3.6.5 5.2 4.1 3.6 7.7C19.5 16.4 12 21 12 21z"/></svg>
          <svg viewBox="0 0 24 24" fill="none" stroke="#1B1B1F" stroke-width="1.8"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5 8.3 8.3 0 0 1-4-1L3 20l1-4.4A8.3 8.3 0 0 1 3 11.5 8.5 8.5 0 0 1 11.5 3 8.5 8.5 0 0 1 21 11.5z"/></svg>
        </div>
        <div class="post-stats" id="likes"></div>
        <div class="post-caption" id="caption"></div>
      </div>
    </div>
    <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
  </div>

<script>
  // ---------- MOCK DATA (troque depois pela leitura via Supabase) ----------
  // TODO: substituir por fetch/Realtime no Supabase, ordenando por exibido_em (nulls first)
  const posts = [
    {
      username: "bigvoxbr", location: "Balada Teste",
      avatar: "https://picsum.photos/seed/1/150",
      media: "https://picsum.photos/seed/1/1080/1350",
      likes: 45, comments: 3,
      caption: "Curtindo a noite! 🎉",
      tags: "#bigvoxbr #balada"
    },
    {
      username: "bigvoxbr", location: "Balada Teste",
      avatar: "https://picsum.photos/seed/2/150",
      media: "https://picsum.photos/seed/2/1080/1350",
      likes: 20, comments: 1,
      caption: "Melhor festa do ano",
      tags: "#bigvoxbr"
    },
    {
      username: "bigvoxbr", location: "Balada Teste",
      avatar: "https://picsum.photos/seed/3/150",
      media: "https://picsum.photos/seed/3/1080/1350",
      likes: 120, comments: 8,
      caption: "Vibes 🔥",
      tags: "#bigvoxbr #evento"
    },
    {
      username: "bigvoxbr", location: "Balada Teste",
      avatar: "https://picsum.photos/seed/4/150",
      media: "https://picsum.photos/seed/4/1080/1350",
      likes: 5, comments: 0,
      caption: "Chegando!",
      tags: "#bigvoxbr"
    },
    {
      username: "bigvoxbr", location: "Balada Teste",
      avatar: "https://picsum.photos/seed/5/150",
      media: "https://picsum.photos/seed/5/1080/1350",
      likes: 200, comments: 12,
      caption: "Só alegria 🎊",
      tags: "#bigvoxbr #balada"
    }
  ];

  let idx = 0;
  const card = document.getElementById('card');
  const fill = document.getElementById('progressFill');

  function render(post) {
    document.getElementById('avatar').src = post.avatar;
    document.getElementById('media').src = post.media;
    document.getElementById('username').textContent = post.username;
    document.getElementById('location').textContent = post.location;
    document.getElementById('likes').textContent = post.likes.toLocaleString('pt-BR') + ' curtidas';
    document.getElementById('caption').innerHTML =
      '<span class="name">' + post.username + '</span>' + post.caption +
      ' <span class="tags">' + post.tags + '</span>';
  }

  function showNext() {
    card.classList.remove('visible');
    fill.classList.remove('animating');
    fill.style.width = '0%';
    setTimeout(() => {
      render(posts[idx]);
      idx = (idx + 1) % posts.length;
      card.classList.add('visible');
      requestAnimationFrame(() => fill.classList.add('animating'));
    }, 350);
  }

  function applyOrientation() {
    const landscape = window.innerWidth >= window.innerHeight;
    document.body.classList.toggle('is-landscape', landscape);
    document.body.classList.toggle('is-portrait', !landscape);
  }
  window.addEventListener('resize', applyOrientation);
  applyOrientation();

  showNext();
  setInterval(showNext, 10000);
</script>
</body>
</html>
